# D1 v2 sweep (docs/experiments.md §10; pre-registered before collection).
# Purpose: fill the platform x size gap found in D1 v1 (docs/results_d1_v1.md §6).
#   A. the 21 D1 v1 generated designs on asap7, gf180, ihp-sg13g2, sky130hd (2 configs each);
#   B. two larger generated designs (~5-10k cells) on all five platforms (default config);
#   C. four bundled asap7 designs not in D1 v1 (new design groups; no blocks or macros).
# No new gcd runs. Stopping rule: freeze after this sweep completes or 5 chunks.
# The v2c00 validation runs (gen_validate_v2.yaml) use the same designs' default configs and
# are not repeated: their run ids coincide with this plan's default-config runs.
name: d1_v2
target: finish
timeout_s: 1800
seed: 20261125
default_repeats: 1
space:
  CORE_UTILIZATION: ["30", "40", "50", "60"]
  PLACE_DENSITY_LB_ADDON: ["0.1", "0.2", "0.3"]
  GPL_TIMING_DRIVEN: ["0", "1"]
  GPL_ROUTABILITY_DRIVEN: ["0", "1"]
  TNS_END_PERCENT: ["5", "100"]
  SYNTH_HIERARCHICAL: ["0", "1"]
designs:
