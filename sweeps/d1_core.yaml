  - {generate: {family: crc, params: {width: 64}}, n_configs: 3, expected_s: 200}
  - {generate: {family: alu, params: {width: 8}}, n_configs: 3, expected_s: 200}
  - {generate: {family: alu, params: {width: 32}}, n_configs: 3, expected_s: 200}
  - {generate: {family: alu, params: {width: 64}}, n_configs: 3, expected_s: 200}
