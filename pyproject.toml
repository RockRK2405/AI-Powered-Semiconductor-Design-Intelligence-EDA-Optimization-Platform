[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconai"
version = "0.1.0"
description = "Semiconductor design intelligence over open-source EDA flows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
siliconai = "siliconai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eda: needs real EDA tools (yosys / docker ORFS); skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S603", "S607"]  # subprocess use is centralised and reviewed in eda/runner.py

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
